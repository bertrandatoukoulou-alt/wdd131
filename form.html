<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="A form for users to submit their reviews on products.">
    <meta name="author" content="Koffi Atoukoulou">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <style>
    </style>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <label for="product">Product Name<span class="required"></span></label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating<span class="required"></span></legend>
                <div class="rating-group">
                    <label for="rating1"><input type="radio" id="rating1" name="rating" value="1" required> 1★</label>
                    <label for="rating2"><input type="radio" id="rating2" name="rating" value="2"> 2★</label>
                    <label for="rating3"><input type="radio" id="rating3" name="rating" value="3"> 3★</label>
                    <label for="rating4"><input type="radio" id="rating4" name="rating" value="4"> 4★</label>
                    <label for="rating5"><input type="radio" id="rating5" name="rating" value="5"> 5★</label>
                </div>
            </fieldset>

            <label for="installDate">Date of Installation<span class="required"></span></label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Useful Features (Check all that apply)</legend>
                <label for="feature1"><input type="checkbox" id="feature1" name="features" value="durability">
                    Durability</label>
                <label for="feature2"><input type="checkbox" id="feature2" name="features" value="ease-of-use"> Ease of
                    Use</label>
                <label for="feature3"><input type="checkbox" id="feature3" name="features" value="performance">
                    Performance</label>
                <label for="feature4"><input type="checkbox" id="feature4" name="features" value="design">
                    Design</label>
            </fieldset>

            <label for="reviewText">Written Review (Optional)</label>
            <textarea id="reviewText" name="reviewText" rows="4"></textarea>

            <label for="username">Your Name (Optional)</label>
            <input type="text" id="username" name="username" placeholder="Enter your name">

            <input type="submit" value="Post Review" class="submit-btn">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Bertrand ATOUKOULOU – Togo</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
